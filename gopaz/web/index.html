<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gopaz</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" style="stroke-width:3"/></symbol>
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></symbol>
  <symbol id="i-divider" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M12 3v18"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-frames" viewBox="0 0 24 24"><rect x="3" y="5" width="7" height="14" rx="1"/><rect x="14" y="5" width="7" height="14" rx="1"/><path d="M10 12h4"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-play"/></svg></span>
      <span class="brand-name">Gopaz</span>
      <span class="brand-tag">LOCAL</span>
    </div>
    <div class="topbar-center" id="serverState" data-i18n="status.ready">Ready</div>
    <div class="topbar-actions">
      <button class="ghost lang-button" id="languageButton" title="Switch language">中文</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <section class="side-section">
        <div class="section-head">
          <span data-i18n="input.title">Input</span>
          <button class="text-button" id="changeInputButton" data-i18n="input.change" hidden>Change</button>
        </div>
        <div id="inputEmpty">
          <button class="file-button" id="pickInputButton">
            <svg class="icon"><use href="#i-upload"/></svg>
            <span data-i18n="input.select">Select video</span>
          </button>
        </div>
        <div id="inputCard" hidden>
          <div class="input-name" id="inputName"></div>
          <div class="input-path" id="inputPathLabel"></div>
          <div class="meta-grid">
            <div><span data-i18n="meta.resolution">Resolution</span><b id="metaSize">—</b></div>
            <div><span data-i18n="meta.fps">Frame rate</span><b id="metaFps">—</b></div>
            <div><span data-i18n="meta.frames">Frames</span><b id="metaFrames">—</b></div>
            <div><span data-i18n="meta.duration">Duration</span><b id="metaDuration">—</b></div>
          </div>
          <div class="badges">
            <span class="badge" id="metaAudio"></span>
            <span class="badge" id="metaBytes"></span>
          </div>
        </div>
      </section>

      <section class="side-section filters">
        <div class="section-head"><span data-i18n="filters.title">Filters</span></div>
        <div id="filterList"></div>
      </section>

      <section class="side-section compute">
        <div class="section-head"><span data-i18n="compute.title">Compute</span></div>
        <label class="field"><span data-i18n="compute.provider">Provider</span><select id="providerSelect"></select></label>
        <label class="field" id="deviceField"><span data-i18n="compute.device">Device</span><select id="deviceSelect"></select></label>
      </section>

      <section class="side-footer">
        <div class="cli-hint-label" data-i18n="cli.label">Equivalent CLI command</div>
        <div class="cli-hint" id="cliHint"></div>
      </section>
    </aside>

    <section class="stage">
      <div class="stage-empty" id="stageEmpty">
        <div class="stage-empty-inner">
          <div class="stage-mark"><svg class="icon"><use href="#i-film"/></svg></div>
          <h1 data-i18n="stage.title">Import a video to start</h1>
          <p data-i18n="stage.desc">Pick a local video to begin.</p>
          <button class="primary large" id="stagePickButton" data-i18n="stage.select">Select video</button>
        </div>
      </div>
      <div class="player" id="player" hidden>
        <div class="player-top">
          <span class="preview-file" id="previewFile"></span>
          <span class="badge accent" id="previewKind"></span>
        </div>
        <div class="player-stage mode-original" id="playerStage">
          <video id="videoOriginal" class="player-video original" playsinline muted preload="metadata"></video>
          <video id="videoProcessed" class="player-video processed" playsinline muted preload="metadata"></video>
          <div class="player-message" id="playerMessage" hidden></div>
          <div class="divider-line" id="dividerLine" hidden><span class="divider-grip"></span></div>
        </div>
        <div class="player-controls">
          <button class="icon-button" id="playButton" data-i18n-title="player.play" title="Play"><svg class="icon"><use href="#i-play"/></svg></button>
          <div class="timeline" id="timeline">
            <div class="timeline-range" id="timelineRange" hidden></div>
            <input type="range" id="seekBar" min="0" max="1" step="0.01" value="0">
          </div>
          <div class="player-actions">
            <div class="segmented player-mode" id="modeSwitch">
              <button type="button" data-mode="original" data-i18n="player.original">Original</button>
              <button type="button" data-mode="processed" data-i18n="player.processed">Processed</button>
            </div>
            <button class="icon-button" id="sideButton" data-i18n-title="player.side" title="Side by side"><svg class="icon"><use href="#i-side"/></svg></button>
            <button class="icon-button" id="dividerButton" data-i18n-title="player.divider" title="Divider compare"><svg class="icon"><use href="#i-divider"/></svg></button>
          </div>
        </div>
        <div class="player-footer">
          <span id="previewPath"></span>
          <span id="previewRangeLabel"></span>
          <span id="previewDuration"></span>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <div class="inspector-title">
        <span data-i18n="settings.title">Settings</span>
        <span class="badge accent" id="modelBadge">Proteus</span>
      </div>
      <div id="modelSettings"></div>

      <div class="divider"></div>
      <div class="section-head"><span data-i18n="settings.output">Output</span></div>
      <div class="field-grid">
        <label class="field span-2"><span data-i18n="settings.encoder">Encoder</span><select id="encoderSelect"></select></label>
        <label class="field"><span data-i18n="settings.container">Container</span><select id="containerSelect"></select></label>
        <label class="field"><span data-i18n="settings.quality">Quality</span><select id="qualitySelect"><option>High</option><option>Mid</option><option>Low</option></select></label>
        <label class="field"><span data-i18n="settings.rateControl">Rate control</span><select id="rateControlSelect"><option value="cq">CQ</option><option value="cbr">CBR</option><option value="vbr">VBR</option></select></label>
        <label class="field" id="bitrateField" hidden><span data-i18n="settings.bitrate">Bitrate Mbps</span><input id="bitrateInput" type="number" min="1" step="1" value="20"></label>
        <label class="field"><span data-i18n="settings.audio">Audio</span><select id="audioSelect"><option value="copy" data-i18n="settings.audioCopy">Copy</option><option value="aac">AAC</option><option value="ac3">AC3</option><option value="pcm">PCM</option><option value="vorbis">Vorbis</option><option value="none" data-i18n="settings.audioNone">None</option></select></label>
        <label class="field" id="audioBitrateField" hidden><span data-i18n="settings.audioBitrate">Audio bitrate kbps</span><input id="audioBitrateInput" type="number" min="32" step="16" value="320"></label>
      </div>

      <details class="advanced" id="advancedPanel">
        <summary data-i18n="settings.advanced">Advanced</summary>
        <div class="field-grid">
          <label class="field"><span data-i18n="settings.gpu">GPU</span><select id="gpuSelect"><option value="-2" data-i18n="settings.auto">Auto</option><option value="-1" data-i18n="settings.cpu">CPU</option><option value="0">Device 0</option><option value="1">Device 1</option><option value="2">Device 2</option><option value="3">Device 3</option></select></label>
          <label class="field"><span data-i18n="settings.threads">Threads</span><input id="threadsInput" type="number" min="0" value="0"></label>
          <label class="field"><span data-i18n="settings.workers">Workers</span><input id="workersInput" type="number" min="0" value="0"></label>
          <label class="field"><span data-i18n="settings.vram">VRAM limit GB</span><input id="vramInput" type="number" min="0" step="0.5" value="0"></label>
          <label class="field"><span data-i18n="settings.qp">QP override</span><input id="qpInput" type="number" min="0" value="0"></label>
          <label class="field" id="instancesField" hidden><span data-i18n="settings.instances">Interp sessions</span><input id="instancesInput" type="number" min="0" value="0"></label>
          <label class="field" id="gpuVramField" hidden><span data-i18n="settings.gpuVram">Aion tile budget GB</span><input id="gpuVramInput" type="number" min="0" step="0.5" value="0"></label>
          <label class="field"><span data-i18n="settings.overlap">Overlap</span><input id="overlapInput" type="number" min="0" value="0"></label>
          <label class="field" id="kcolorField"><span data-i18n="settings.kcolor">keepColor</span><select id="kcolorSelect"><option value="1" data-i18n="settings.on">On</option><option value="0" data-i18n="settings.off">Off</option></select></label>
          <label class="field" id="sceneField"><span data-i18n="settings.scene">Scene threshold</span><input id="sceneInput" type="number" step="0.1" value="6.5"></label>
          <label class="field"><span data-i18n="settings.start">Start frame</span><input id="startInput" type="number" value="-1"></label>
          <label class="field"><span data-i18n="settings.end">End frame</span><input id="endInput" type="number" value="-1"></label>
        </div>
      </details>

      <div class="divider"></div>
      <div class="output-box">
        <div class="section-head"><span data-i18n="output.saveTo">Save to</span></div>
        <div class="path-entry">
          <input class="path-input" id="outputDirInput" type="text" spellcheck="false" data-i18n-placeholder="output.placeholder" placeholder="Default: same folder as input">
          <button class="icon-button" id="pickOutputDirButton" data-i18n-title="output.pickFolder" title="Select folder"><svg class="icon"><use href="#i-folder"/></svg></button>
        </div>
        <div class="output-name">
          <div class="output-name-head">
            <span id="outputNameLabel" data-i18n="output.autoName">Auto name</span>
            <button class="text-button" id="resetOutputName" data-i18n="output.reset" hidden>Auto</button>
          </div>
          <input class="path-input output-name-input" id="outputNameInput" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="output.namePlaceholder" placeholder="File name">
          <div class="output-name-hint" id="outputNameHint"></div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="taskbar">
    <div class="task-main">
      <div class="progress-area">
        <div class="progress-head"><span class="progress-stats"><span id="taskSpeed">— fps</span><span id="taskEta">ETA —</span></span><span id="progressLabel">Ready</span><span id="progressValue">0%</span></div>
        <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="task-actions">
        <button class="ghost" id="logButton">Logs</button>
        <button class="ghost" id="previewButton" data-i18n="task.preview" disabled>Preview</button>
        <button class="ghost" id="cancelButton" data-i18n="task.cancel" hidden>Cancel</button>
        <button class="ghost" id="revealButton" data-i18n="task.reveal" hidden>Open output location</button>
        <button class="primary" id="startButton" disabled>Start</button>
      </div>
    </div>
    <pre class="log-panel" id="logPanel" hidden></pre>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
